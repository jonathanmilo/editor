<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:" />
  <title>Máquina de escribir</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/courier-prime/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/courier-prime/700.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/newsreader/400-italic.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/newsreader/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/400.css" />
  <link rel="stylesheet" href="../node_modules/@fontsource/inter/500.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-light typewriter view-library">

  <!-- ================= BIBLIOTECA ================= -->
  <section id="library" aria-label="Biblioteca">
    <div class="drag-strip"></div>
    <div class="lib-inner">
      <header class="lib-head">
        <h1>Máquina de escribir</h1>
        <p class="lib-sub">Tus textos, uno a uno, bajo la lámpara.</p>
      </header>
      <div class="lib-actions">
        <button class="btn primary" id="lib-new">Nuevo documento</button>
        <button class="btn" id="lib-open">Abrir archivo…</button>
      </div>
      <ul id="doc-list"></ul>
      <p id="lib-empty" hidden>Todavía no hay documentos. Empieza uno nuevo.</p>
    </div>
  </section>

  <!-- ================= EDITOR ================= -->
  <section id="editor" aria-label="Editor">
    <!-- luz de la lámpara (recortada en el riel) -->
    <div id="light-clip" aria-hidden="true">
      <div id="light"><div class="cone"></div><div class="core"></div></div>
    </div>

    <!-- papel / texto -->
    <div id="paper">
      <div id="page">
        <textarea id="text" spellcheck="true" autocomplete="off" placeholder="Empieza a escribir…"></textarea>
      </div>
    </div>

    <!-- riel y carro -->
    <div id="rail" aria-hidden="true"><span class="cap l"></span><span class="cap r"></span></div>
    <div id="carriage" aria-hidden="true">
      <div class="typebar"></div>
      <div class="body"><i></i><i></i><i></i></div>
    </div>

    <!-- barra superior -->
    <header id="topbar">
      <button class="icon" id="back" title="Biblioteca (Ctrl+L)" aria-label="Volver a la biblioteca">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <label class="tw-toggle" title="Ctrl+Shift+T">
        <span>Máquina de escribir</span>
        <input type="checkbox" id="tw-switch" checked />
        <span class="switch"></span>
        <span class="tw-state" id="tw-state">Activada</span>
      </label>
      <span class="save-state" id="save-state"></span>
      <div class="spacer"></div>
      <span id="wordcount">0 palabras</span>
      <button class="icon" id="theme-btn" title="Tema (Ctrl+Shift+L)" aria-label="Cambiar tema">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon" id="settings-btn" title="Ajustes (Ctrl+,)" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <button id="notes-btn" title="Ctrl+Shift+N">Notas de escritura
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
    </button>

    <!-- panel de notas -->
    <aside id="notes-panel" class="panel">
      <div class="panel-head">
        <h2>Notas de escritura</h2>
        <button class="icon close" data-close="notes" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <textarea id="notes" placeholder="Personajes, ideas, pendientes…"></textarea>
    </aside>

    <!-- panel de ajustes -->
    <aside id="settings-panel" class="panel">
      <div class="panel-head">
        <h2>Ajustes</h2>
        <button class="icon close" data-close="settings" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="field">
        <label for="s-font">Tipografía</label>
        <select id="s-font">
          <option value="'Courier Prime', 'Courier New', monospace">Courier Prime</option>
          <option value="'IBM Plex Mono', 'Consolas', monospace">IBM Plex Mono</option>
          <option value="'Courier New', Courier, monospace">Courier New</option>
          <option value="Consolas, 'Cascadia Mono', monospace">Consolas</option>
        </select>
      </div>
      <div class="field">
        <label for="s-size">Tamaño de letra <output id="o-size"></output></label>
        <input type="range" id="s-size" min="14" max="34" step="1" />
      </div>
      <div class="field">
        <label for="s-width">Ancho de línea <output id="o-width"></output></label>
        <input type="range" id="s-width" min="36" max="100" step="2" />
      </div>
      <div class="field">
        <label for="s-rail">Altura del riel <output id="o-rail"></output></label>
        <input type="range" id="s-rail" min="45" max="90" step="1" />
      </div>
      <div class="field">
        <label for="s-light">Intensidad de la luz <output id="o-light"></output></label>
        <input type="range" id="s-light" min="0" max="100" step="5" />
      </div>
      <div class="field check">
        <label><input type="checkbox" id="s-sound" /> Sonido de teclas</label>
      </div>
      <div class="field check">
        <label><input type="checkbox" id="s-fade" /> Atenuar el texto lejano</label>
      </div>
      <div class="field check">
        <label><input type="checkbox" id="s-strict" /> Sin borrar (máquina estricta)</label>
      </div>
      <div class="panel-sep"></div>
      <div class="field">
        <label>Exportar</label>
        <div class="row">
          <button class="btn small" data-export="docx">Word</button>
          <button class="btn small" data-export="txt">.txt</button>
          <button class="btn small" data-export="md">.md</button>
        </div>
      </div>
      <p class="hint">Ctrl+S guarda · Ctrl+E exporta a Word · rueda del ratón para releer</p>
    </aside>

    <div id="toast" role="status"></div>
  </section>

  <script src="sound.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
