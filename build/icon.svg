<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a332f"/>
      <stop offset="1" stop-color="#1b1715"/>
    </linearGradient>
    <radialGradient id="light" cx="512" cy="742" r="560" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 742) scale(1 1.15) translate(-512 -742)">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="1"/>
      <stop offset=".45" stop-color="#f6dfb5" stop-opacity=".85"/>
      <stop offset=".8" stop-color="#e9c48a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e9c48a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b544f"/><stop offset=".35" stop-color="#151312"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c0b9"/><stop offset="1" stop-color="#9c938d"/>
    </linearGradient>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- cono de luz -->
    <path d="M420 742 L604 742 L980 60 L44 60 Z" fill="url(#light)" filter="url(#blur)"/>
    <ellipse cx="512" cy="560" rx="250" ry="210" fill="#fff4dc" opacity=".55" filter="url(#blur)"/>
    <!-- letra -->
    <text x="512" y="660" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="600" fill="#1d1916">e</text>
    <!-- tipo (T) -->
    <rect x="482" y="688" width="60" height="12" rx="3" fill="#1d1916"/>
    <rect x="507" y="700" width="10" height="30" fill="#3a3430"/>
    <!-- riel -->
    <rect x="-10" y="742" width="1044" height="34" fill="url(#rail)"/>
    <!-- carro -->
    <rect x="382" y="716" width="260" height="84" rx="42" fill="url(#car)"/>
    <rect x="382" y="716" width="260" height="84" rx="42" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>
    <circle cx="438" cy="758" r="13" fill="#f2b54a"/>
    <circle cx="474" cy="758" r="13" fill="#f2b54a"/>
    <circle cx="510" cy="758" r="13" fill="#3a3532"/>
  </g>
</svg>
